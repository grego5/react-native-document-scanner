plugins { id 'com.android.application' }

android {
  namespace 'dev.documentscanner.resolutioncheck'
  compileSdk 37
  defaultConfig {
    applicationId 'dev.documentscanner.resolutioncheck'
    minSdk 24
    targetSdk 36
    versionCode 1
    versionName '1.0'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  // Compile the scanner's own ranking, not a copy.
  sourceSets.main.java {
    srcDirs 'src/main/java', '../../../android/src/main/java'
    include 'dev/documentscanner/resolutioncheck/**'
    include 'com/margelo/nitro/documentscanner/CaptureResolutionPolicy.kt'
    include 'com/margelo/nitro/documentscanner/CameraExposurePolicy.kt'
  }
}

dependencies {
  implementation 'androidx.activity:activity-ktx:1.13.0'
  implementation 'androidx.camera:camera-core:1.7.0-rc01'
  implementation 'androidx.camera:camera-camera2:1.7.0-rc01'
  implementation 'androidx.camera:camera-lifecycle:1.7.0-rc01'
  implementation 'androidx.camera:camera-view:1.7.0-rc01'
}
