apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

apply from: '../nitrogen/generated/android/ReactNativeDocumentScanner+autolinking.gradle'


def safeExtGet(String property, Object fallback) {
  rootProject.ext.has(property) ? rootProject.ext.get(property) : fallback
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get('reactNativeArchitectures')
  return value ? value.split(',') : ['arm64-v8a']
}

android {
  namespace 'com.margelo.nitro.documentscanner'
  // Opt-in release instrumentation for measurements; ordinary device checks stay debug.
  testBuildType project.findProperty('documentScannerTestBuildType') ?: 'debug'
  compileSdkVersion safeExtGet('compileSdkVersion', 36)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)
    targetSdkVersion safeExtGet('targetSdkVersion', 36)
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    consumerProguardFiles 'consumer-rules.pro'
    externalNativeBuild {
      cmake {
        cppFlags '-std=c++20 -frtti -fexceptions'
        arguments '-DANDROID_STL=c++_shared'
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  testOptions {
    unitTests.returnDefaultValues = true
    unitTests.all { test ->
      test.systemProperty 'liveGuideTraceReport', file('build/reports/live-guide-trace').absolutePath
      // JVM replay of recorded live guide traces: -PliveGuideTrace=<file or directory>, relative to the repository root.
      def liveGuideTrace = project.findProperty('liveGuideTrace')
      if (liveGuideTrace) {
        def trace = new File(liveGuideTrace.toString())
        if (!trace.absolute) trace = new File(projectDir.parentFile, liveGuideTrace.toString())
        test.systemProperty 'liveGuideTrace', trace.absolutePath
        test.inputs.files(trace).withPropertyName('liveGuideTrace')
      }
    }
  }

  // Keep the runtime asset path doccornernet/model.tflite while sharing its canonical source.
  sourceSets.main.assets.srcDir('../resources')

  // Share the unchanged Kotlin resize oracle between JVM and instrumentation tests only.
  sourceSets.test.java.srcDir('src/testSupport/java')
  sourceSets.androidTest.java.srcDir('src/testSupport/java')
  sourceSets.test.resources.srcDir('../tests/fixtures')
  sourceSets.androidTest.assets.srcDir('../tests/fixtures')

  // Explicit instrumentation-only fixtures. Never add private photos to main/release assets.
  def runtimeFixtures = project.findProperty('docCornerFixtures')
  if (runtimeFixtures) {
    sourceSets.androidTest.assets.srcDir(file(runtimeFixtures))
  }

  packagingOptions {
    jniLibs {
      pickFirsts += ['**/libc++_shared.so', '**/libfbjni.so', '**/libjsi.so', '**/libreactnative.so']
    }
  }

  buildFeatures {
    prefab true
  }

  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

def cameraXVersion = '1.7.0-rc01'
def openCvVersion = '4.12.0'

dependencies {
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  implementation 'com.facebook.react:react-android'
  implementation project(':react-native-nitro-modules')
  implementation 'androidx.activity:activity-ktx:1.13.0'
  implementation "androidx.camera:camera-core:${cameraXVersion}"
  implementation "androidx.camera:camera-camera2:${cameraXVersion}"
  implementation "androidx.camera:camera-lifecycle:${cameraXVersion}"
  implementation "androidx.camera:camera-view:${cameraXVersion}"
  implementation 'androidx.exifinterface:exifinterface:1.4.2'
  implementation 'androidx.recyclerview:recyclerview:1.4.0'
  implementation "org.opencv:opencv:${openCvVersion}"
  implementation 'com.google.ai.edge.litert:litert:1.4.2'
}

tasks.register('verifyDocCornerModelAsset') {
  def assetFile = file('../resources/doccornernet/model.tflite')
  def provenance = file('../resources/doccornernet/provenance.json')
  inputs.files(assetFile, provenance)
  doLast {
    if (!assetFile.isFile()) throw new GradleException('DocCornerNet asset is missing. See tools/models/README.md for model export instructions.')
    def expected = new groovy.json.JsonSlurper().parse(provenance).tfliteSha256
    def hash = java.security.MessageDigest.getInstance('SHA-256').digest(assetFile.bytes).encodeHex().toString()
    if (hash != expected) throw new GradleException('DocCornerNet model SHA-256 mismatch.')
  }
}

tasks.named('preBuild').configure {
  dependsOn tasks.named('verifyDocCornerModelAsset')
}
